<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0"
    />
    <link rel="icon" href="dist/logo.ico" />
    <title>思绪思维导图</title>
    <link rel="stylesheet" href="<%= BASE_URL %>style.css">
    <!-- 拖拽功能 Polyfill -->
    <link rel="stylesheet" href="<%= BASE_URL %>default.css">
    <script src="<%= BASE_URL %>index.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            MobileDragDrop.polyfill({ holdToDrag: 300 }); 
        });
    </script>
    <script>
      // 自定义静态资源的路径
      window.externalPublicPath = './dist/'
      // 接管应用
      window.takeOverApp = false
    </script>
    
<!-- 彻底拔除 51LA 数据追踪探针 -->
    
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work
        properly without JavaScript enabled. Please enable it to
        continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->

    <!-- ================= 极客灵动岛 (零侵入悬浮组件) ================= -->
    <div id="geek-island" class="geek-island">
      <!-- 1. 主控圆点 -->
      <div id="island-toggle" class="island-toggle">☁️</div>
      
      <!-- 2. 隐藏的胶囊菜单 -->
      <div id="island-menu" class="island-menu">
        <div class="menu-btn" id="menu-btn-new-note" title="新建终端">📄</div>
        <div class="menu-btn" id="menu-btn-hall" title="文件大厅">🗂️</div>
        <div class="menu-btn" id="menu-btn-save" title="安全同步">💾</div>
        <div class="menu-btn" id="btn-file-encrypt" title="独立加密">🔐</div>
        <div class="menu-btn" id="btn-logout" title="物理拔线">🚪</div>
      </div>

      <!-- 3. 状态吐司 (对应 ui.js 的 logStatus 目标) -->
      <div id="status-bar" class="island-toast">✅ 系统就绪</div>
    </div>

    <style>
      /* 灵动岛核心布局 */
      .geek-island {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* 主控圆点 */
      .island-toggle {
        width: 44px;
        height: 44px;
        background: rgba(22, 27, 34, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        cursor: pointer;
        color: #fff;
        box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s;
      }
      .island-toggle:hover { background: rgba(31, 111, 235, 0.9); }
      .geek-island.active .island-toggle { transform: rotate(180deg); }

      /* 胶囊菜单 */
      .island-menu {
        display: flex;
        align-items: center;
        background: rgba(22, 27, 34, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 22px;
        padding: 0;
        width: 0;
        opacity: 0;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .geek-island.active .island-menu {
        width: 240px; /* 展开宽度 */
        padding: 0 12px;
        opacity: 1;
      }

      /* 菜单按钮 */
      .menu-btn {
        width: 36px;
        height: 36px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        cursor: pointer;
        border-radius: 50%;
        transition: background 0.2s, transform 0.2s;
        flex-shrink: 0;
      }
      .menu-btn:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.1); }

      /* 状态吐司 (隐藏与滑出) */
      .island-toast {
        background: rgba(31, 111, 235, 0.9);
        backdrop-filter: blur(8px);
        color: #fff;
        padding: 8px 16px;
        border-radius: 18px;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        opacity: 0;
        transform: translateX(-20px);
        transition: all 0.3s ease;
        pointer-events: none;
      }
      .island-toast.show {
        opacity: 1;
        transform: translateX(0);
      }
    </style>

    <script>
      // 灵动岛交互逻辑
      const island = document.getElementById('geek-island');
      const toggleBtn = document.getElementById('island-toggle');
      const statusBar = document.getElementById('status-bar');
      let toastTimer = null;

      // 展开/收起菜单
      toggleBtn.addEventListener('click', () => {
        island.classList.toggle('active');
      });

      // 劫持系统的文本修改，实现 5 秒自动消隐
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          if (mutation.type === 'childList' || mutation.type === 'characterData') {
            statusBar.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
              statusBar.classList.remove('show');
            }, 5000);
          }
        });
      });
      observer.observe(statusBar, { childList: true, characterData: true, subtree: true });
    </script>

    <!-- ================= 全屏模态框：文件大厅 ================= -->
    <div class="modal-overlay" id="fileBrowserModal">
        <div class="modal-content" id="modal-content-area">
            <div class="modal-header">
                <div class="modal-title">文件大厅</div>
                <div class="btn-close" id="btn-close-modal" title="关闭">&times;</div>
            </div>
            <div class="modal-body">
                <div class="modal-sidebar" style="display: flex; flex-direction: column; padding: 0;">
                    <div style="padding: 16px 12px 8px 12px;">
                        <div class="tag-item active" id="view-all-files">📁 所有文件</div>
                    </div>
                    <div style="height: 1px; background: var(--border-light); margin: 4px 12px;"></div>
                    <div style="padding: 8px 16px; display: flex; align-items: center; justify-content: space-between;">
                        <span style="font-size: 13px; font-weight: bold; color: var(--text-muted);">自定义标签</span>
                        <button id="btn-add-tag" title="新建标签" style="background: transparent; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); padding: 0 4px; line-height: 1; transition: color 0.2s;">+</button>
                    </div>
                    <div id="tag-sidebar-list" style="flex: 1; overflow-y: auto; padding: 4px 12px;"></div>
                </div>
                <div class="modal-main">
                    <div class="file-grid" id="file-grid-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= 模态框：新建标签 ================= -->
    <div class="modal-overlay" id="tagModal" style="z-index: 999999;">
        <div class="modal-content" style="width: 340px; height: max-content; padding: 20px 24px; display: block; overflow: visible; background: var(--bg-body);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div id="tag-cancel" style="color: var(--color-accent); font-size: 15px; cursor: pointer;">取消</div>
                <div style="font-size: 16px; font-weight: 600; color: var(--text-main);" id="tag-modal-title">新建标签</div>
                <div id="tag-confirm" style="color: var(--color-accent); font-size: 15px; font-weight: 600; cursor: pointer;">完成</div>
            </div>
            <input type="text" id="tag-name-input" placeholder="输入标签名称..." style="width: 100%; box-sizing: border-box; padding: 12px; border: none; border-radius: 8px; margin-bottom: 20px; outline: none; font-size: 15px; background: var(--bg-panel); color: var(--text-main);">
            <div style="margin-bottom: 24px;">
                <div style="font-size: 14px; color: var(--text-main); margin-bottom: 12px; font-weight: 500;">选择颜色</div>
                <div id="tag-color-picker" style="display: flex; gap: 12px; flex-wrap: wrap;"></div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border-light);">
                <div style="font-size: 15px; color: var(--text-main); font-weight: 500;">父级标签</div>
                <select id="tag-parent-select" style="font-size: 15px; border: none; outline: none; color: var(--text-muted); background: transparent; cursor: pointer; text-align: right; direction: rtl;"></select>
            </div>
            <div id="tag-edit-actions" style="display: none; margin-top: 16px; border-top: 1px solid var(--border-light); padding-top: 8px;">
                <div id="btn-delete-tag" style="padding: 12px 0; color: #f85149; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <span>🗑️</span> 删除此标签
                </div>
            </div>
        </div>
    </div>
    
    <script>
      const getDataFromBackend = () => {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve({
              mindMapData: {
                root: {
                  data: {
                    text: '根节点'
                  },
                  children: []
                },
                theme: {
                  template: 'avocado',
                  config: {}
                },
                layout: 'logicalStructure',
                config: {},
                view: null
              },
              mindMapConfig: {},
              lang: 'zh',
              localConfig: null
            })
          }, 200)
        })
      }
      const setTakeOverAppMethods = data => {
        window.takeOverAppMethods = {}
        // 获取思维导图数据的函数
        window.takeOverAppMethods.getMindMapData = () => {
          return data.mindMapData
        }
        // 保存思维导图数据的函数
        window.takeOverAppMethods.saveMindMapData = data => {
          console.log(data)
        }
        // 获取思维导图配置，也就是实例化时会传入的选项
        window.takeOverAppMethods.getMindMapConfig = () => {
          return data.mindMapConfig
        }
        // 保存思维导图配置
        window.takeOverAppMethods.saveMindMapConfig = config => {
          console.log(config)
        }
        // 获取语言的函数
        window.takeOverAppMethods.getLanguage = () => {
          return data.lang
        }
        // 保存语言的函数
        window.takeOverAppMethods.saveLanguage = lang => {
          console.log(lang)
        }
        // 获取本地配置的函数
        window.takeOverAppMethods.getLocalConfig = () => {
          return data.localConfig
        }
        // 保存本地配置的函数
        window.takeOverAppMethods.saveLocalConfig = config => {
          console.log(config)
        }
      }
      window.onload = async () => {
        if (!window.takeOverApp) return
        // 请求数据
        const data = await getDataFromBackend()
        // 设置全局的方法
        setTakeOverAppMethods(data)
        // 思维导图实例创建完成事件
        window.$bus.$on('app_inited', mindMap => {
          console.log(mindMap)
        })
        // 可以通过window.$bus.$on()来监听应用的一些事件
        // 实例化页面
        window.initApp()
      }
    </script>
  </body>
</html>
